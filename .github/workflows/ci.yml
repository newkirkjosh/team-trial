name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: for f in *.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Tests
        run: bash tests/run.sh
